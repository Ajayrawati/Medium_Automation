rss:
  - name: Hacker News RSS
    url: https://hnrss.org/frontpage
    category: technology
    reliability: 0.65

api:
  - name: Hacker News
    type: hackernews
    category: technology
    reliability: 0.60

scrapers:
  - name: GitHub Trending
    type: github_trending
    category: technology
    reliability: 0.70

pipeline:
  confidence_threshold: 65
  min_independent_sources: 2
  min_evidence_sources: 2
  research_passes: 2
  max_evidence_per_topic: 6
  category_weights:
    technology: 1.0
    business: 0.9
    science: 0.95
    general: 0.8
  confidence_weights:
    source_quality: 0.30
    corroboration: 0.25
    recency: 0.20
    relevance: 0.15
    momentum: 0.10
  manual_votes: {}

article:
  provider: gemini
  model: gemini-3.5-flash-lite
  min_words: 500
  max_words: 800
  # Optional: a licensed or original, wide cover-image URL.
  cover_image_url: ""
